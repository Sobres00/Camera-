name: Compilar APK Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar y Generar Gradle Wrapper
        run: |
          sudo apt-get update && sudo apt-get install -y gradle
          cd android
          gradle wrapper --gradle-version 8.6
          chmod +x gradlew

      - name: Compilar APK Android (assembleDebug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Subir APK como Archivo Descargable
        uses: actions/upload-artifact@v4
        with:
          name: Apex-RAW-Camera-v1.0.apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
