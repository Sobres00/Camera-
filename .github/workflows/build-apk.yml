name: Compilar APK Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js y compilar interfaz
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias web
        run: npm install

      - name: Compilar aplicación web
        run: npm run build

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Dar permisos de ejecución a Gradle
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      - name: Compilar APK con Gradle
        run: |
          if [ -d "android" ]; then
            cd android
            ./gradlew assembleDebug --stacktrace
          else
            echo "Creando APK directo..."
          fi

      - name: Subir APK como Archivo Descargable
        uses: actions/upload-artifact@v4
        with:
          name: Apex-RAW-Camera-v1.0-debug.apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
